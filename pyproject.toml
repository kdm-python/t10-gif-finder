[project]
name = "gif-finder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Kyle Marden", email = "demolaze@Mac.home" }]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "loguru>=0.7.3",
    "pillow>=12.3.0",
    "python-multipart>=0.0.22",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.53.0",
]

[project.scripts]
gif-finder = "gif_finder.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["httpx>=0.28.1", "pytest>=9.1.1"]
