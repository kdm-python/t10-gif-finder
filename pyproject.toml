[project]
name = "gif-finder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kyle Marden", email = "demolaze@Mac.home" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.12",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.52.1",
]

[project.scripts]
gif-finder = "gif_finder:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "loguru>=0.7.3",
    "pytest>=9.1.1",
]
