<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload - T10Nat GIF Finder</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div id="top-row">
        <img src="assets/images/grey_rat.avif" alt="Rat picture" />
        <h1>T10Nat GIF Finder</h1>
        <img src="assets/images/yt_smile.jpg" alt="Nat picture" />
      </div>
      <nav id="button-row" aria-label="Main navigation">
        <a class="nav-link" href="index.html">Home</a
        ><a class="nav-link" href="browse.html">Browse</a
        ><a class="nav-link" href="upload.html" aria-current="page">Upload</a>
      </nav>
    </header>
    <main>
      <p class="page-intro">
        Add a GIF or WebP to the catalogue, then keep its stream and tag context
        close at hand.
      </p>
      <div class="upload-layout">
        <section id="upload-section">
          <h2>Upload media</h2>
          <p class="helper-text">
            A file and at least one comma-separated tag are required.
          </p>
          <form id="upload-form">
            <div class="form-field wide">
              <label for="media-file">File</label
              ><input
                id="media-file"
                type="file"
                accept="image/gif,image/webp"
                required
              />
            </div>
            <div class="form-field wide">
              <label for="media-tags">Tags</label
              ><input
                id="media-tags"
                type="text"
                placeholder="dance, funny, reaction"
                required
              />
            </div>
            <div class="form-field">
              <label for="stream-id">Stream ID</label
              ><input
                id="stream-id"
                type="number"
                min="1"
                inputmode="numeric"
              />
            </div>
            <div class="form-field">
              <label for="author">Author</label
              ><input id="author" type="text" />
            </div>
            <div class="form-field wide">
              <label for="title">Title</label><input id="title" type="text" />
            </div>
            <div class="form-field wide">
              <label for="description">Description</label
              ><textarea id="description"></textarea>
            </div>
            <div class="form-field wide">
              <label for="source-url">Source URL</label
              ><input id="source-url" type="url" placeholder="https://..." />
            </div>
            <div class="form-actions">
              <button type="submit">Upload media</button>
              <p id="upload-status" role="status"></p>
            </div>
          </form>
        </section>
        <section id="media-section">
          <div class="panel-heading">
            <h2>Current media</h2>
            <span id="media-count" class="muted"></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>File</th>
                  <th>Tags</th>
                  <th>Author</th>
                  <th>Stream</th>
                </tr>
              </thead>
              <tbody id="media-display"></tbody>
            </table>
          </div>
        </section>
        <section id="tag-section" class="full-width">
          <div class="panel-heading">
            <h2>Tags</h2>
            <span id="tag-count" class="muted"></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Created</th>
                </tr>
              </thead>
              <tbody id="tags-display"></tbody>
            </table>
          </div>
        </section>
        <section id="stream-section" class="full-width">
          <div class="panel-heading">
            <h2>Streams</h2>
            <span id="stream-count" class="muted"></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Date</th>
                  <th>Description</th>
                </tr>
              </thead>
              <tbody id="streams-display"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
